<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="海事知识库首页视觉原型" />
  <title>潮汐档案 · 海事知识库</title>
  <style>
    :root { --ink:#06141d; --deep:#081d28; --sea:#0d5260; --mist:#eef4f1; --muted:#a5bec0; --signal:#e8b866; --line:rgba(226,244,238,.18); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--mist); background:var(--ink); font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .shell { min-height:100vh; overflow:hidden; position:relative; isolation:isolate; background-image:linear-gradient(90deg, rgba(3,11,16,.82) 0%, rgba(3,16,22,.55) 48%, rgba(3,11,16,.28) 100%), url("https://www.bundeswirtschaftsministerium.de/Redaktion/FR/Bilder/Sujets/maritime-wirtschaft.jpg?__blob=normal&v=1"); background-position:center; background-size:cover; background-repeat:no-repeat; }
    .shell::before { content:""; position:absolute; inset:-20%; z-index:-2; opacity:.75; background:linear-gradient(180deg, rgba(2,12,18,.08), rgba(2,12,18,.42)), linear-gradient(105deg, transparent 30%, rgba(228,183,101,.13) 52%, transparent 70%); animation: drift 18s ease-in-out infinite alternate; }
    .shell::after { content:""; position:absolute; inset:0; z-index:-1; pointer-events:none; background:linear-gradient(90deg, rgba(2,11,17,.55), transparent 44%, rgba(4,13,18,.25)); }
    @keyframes drift { from { transform:translate3d(-2%, 1%, 0) rotate(-1deg) scale(1.05); } to { transform:translate3d(2%, -2%, 0) rotate(1deg) scale(1.1); } }
    .topbar { width:min(1180px, calc(100% - 56px)); margin:0 auto; padding:30px 0; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:12px; letter-spacing:.1em; font-size:13px; text-transform:uppercase; }
    .mark { width:30px; height:30px; border:1px solid rgba(232,184,102,.8); border-radius:50%; display:grid; place-items:center; color:var(--signal); font-size:13px; }
    nav { display:flex; gap:28px; color:var(--muted); font-size:13px; } nav a { color:inherit; text-decoration:none; } nav a:hover { color:var(--mist); }
    .hero { width:min(1180px, calc(100% - 56px)); min-height:calc(100vh - 91px); margin:0 auto; padding:clamp(76px, 13vh, 150px) 0 72px; position:relative; }
    .eyebrow { color:var(--signal); font-size:12px; letter-spacing:.18em; text-transform:uppercase; }
    h1 { color:#f7f1e7; text-shadow:0 3px 24px rgba(0,0,0,.42); max-width:760px; margin:18px 0 22px; font-family: Georgia, "Songti SC", serif; font-size:clamp(54px, 8vw, 112px); font-weight:400; line-height:.98; letter-spacing:-.045em; } h1 em { color:#e8b866; font-style:normal; }
    .intro { max-width:480px; color:#c0d4d0; font-size:17px; line-height:1.75; }
    .search { margin-top:42px; display:flex; width:min(650px, 100%); padding:7px; border:1px solid rgba(221,241,235,.26); border-radius:13px; background:rgba(3,16,23,.45); backdrop-filter:blur(14px); box-shadow:0 20px 60px rgba(0,0,0,.2); }
    .search input { flex:1; min-width:0; border:0; outline:0; padding:14px 16px; color:var(--mist); background:transparent; font:inherit; } .search input::placeholder { color:#91abad; }
    .search button, .cta { border:0; border-radius:8px; padding:0 22px; color:var(--ink); background:var(--signal); font-weight:700; cursor:pointer; } .search button:hover, .cta:hover { background:#f5ce87; }
    .modules { position:absolute; right:0; bottom:72px; width:min(400px, 100%); display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .module { min-height:128px; padding:20px; display:flex; flex-direction:column; justify-content:space-between; border:1px solid var(--line); border-radius:12px; background:rgba(7,27,35,.56); backdrop-filter:blur(12px); transition:transform .3s ease, background .3s ease, border-color .3s ease; }
    .module:hover { transform:translateY(-5px); background:rgba(13,69,77,.68); border-color:rgba(232,184,102,.5); }
    .module small { color:var(--muted); font-size:11px; letter-spacing:.1em; } .module strong { font-family:Georgia, serif; font-size:20px; font-weight:400; } .module span { color:var(--signal); font-size:18px; align-self:flex-end; }
    .source-note { position:absolute; right:0; bottom:20px; color:rgba(239,231,215,.58); font-size:10px; letter-spacing:.04em; }
    .coordinates { position:absolute; left:0; bottom:78px; color:rgba(192,212,208,.58); font-family:ui-monospace, monospace; font-size:10px; letter-spacing:.08em; }
    @media (max-width:760px) { .topbar, .hero { width:min(100% - 34px, 1180px); } nav { display:none; } .hero { padding-top:80px; } h1 { font-size:clamp(50px, 15vw, 82px); } .modules { position:static; margin-top:64px; } .coordinates { position:static; margin-top:34px; } .source-note { position:static; margin-top:24px; } .search button { padding:0 16px; } }
    @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><span class="mark">◒</span><span>TIDAL ARCHIVE</span></div><nav><a href="#regs">规章法规</a><a href="#nav">航海知识</a><a href="#vessels">船舶与设备</a><a href="#about">关于项目</a></nav></header>
    <section class="hero">
      <div class="eyebrow">Maritime knowledge base · 01</div>
      <h1>把海上的<br><em>经验留下来。</em></h1>
      <p class="intro">在海图、规则与真实航行经验之间，建立一套属于自己的海事知识库。</p>
      <form class="search" onsubmit="return false"><input aria-label="搜索海事知识" placeholder="搜索法规、设备、航海知识……" /><button>开始检索</button></form>
      <div class="modules">
        <a class="module" href="#regs"><small>01 / REGULATIONS</small><strong>规章法规</strong><span>↗</span></a>
        <a class="module" href="#nav"><small>02 / NAVIGATION</small><strong>航海知识</strong><span>↗</span></a>
        <a class="module" href="#vessels"><small>03 / VESSELS</small><strong>船舶与设备</strong><span>↗</span></a>
        <a class="module" href="#notes"><small>04 / MY NOTES</small><strong>我的资料</strong><span>↗</span></a>
      </div>
      <div class="coordinates">31°13′N　121°29′E　/　CALM SEA　/　FIELD NOTES</div>
    <p class="source-note">背景图：德国联邦经济与气候保护部 · Maritime Economy</p>
    </section>
  </main>
</body>
</html>
